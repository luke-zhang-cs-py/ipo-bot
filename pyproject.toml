# Tool settings for the keyless bot (bot/). The older scripts in src/ and evaluation/ keep their own style.

[tool.black]
line-length = 120
target-version = ["py311"]
include = '^/(bot|tests/bot)/.*\.pyi?$'

[tool.ruff]
line-length = 120
target-version = "py311"
include = ["bot/**/*.py", "tests/bot/**/*.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = [
    "E501",     # black owns line length
    "UP006",    # typing.Dict and friends: kept for readability alongside Optional
    "UP035",
    "UP045",    # Optional[X] rather than X | None
    "UP007",
    "RUF001",   # curly quotes are matched on purpose in the prospectus parsers
    "SIM108",
    "B905",     # zip() over columns of one frame: equal lengths by construction
]

[tool.mypy]
python_version = "3.11"
files = ["bot"]
strict_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.coverage.run]
source = ["bot"]
branch = true

[tool.coverage.report]
# the 100% gate is the bot's own (--cov-fail-under=100 in CI), so measuring src/ or evaluation/ does not "fail"
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: reads the real network (skipped unless BOT_LIVE_TESTS=1)"]

[tool.mutmut]
# The pure core: calendar, store, parsers, checks, statistics and models. All of bot/ is copied into mutmut's
# sandbox (source_paths), only these files are mutated, and the unit tests run against each mutant (the
# end-to-end runs are too slow to repeat per mutant; they cover the glue). CI runs this weekly on Linux.
source_paths = ["bot"]
only_mutate = [
    "bot/markets.py", "bot/store.py", "bot/prospectus.py", "bot/ipos.py", "bot/checks.py", "bot/stats.py",
    "bot/models.py",
]
pytest_add_cli_args_test_selection = [
    "tests/bot/test_bot_markets.py", "tests/bot/test_bot_store.py", "tests/bot/test_bot_units.py",
    "tests/bot/test_bot_adapters.py", "tests/bot/test_bot_exact.py",
]
mutate_only_covered_lines = true
debug = true
