name: tests

on:
  push:
  pull_request:
  schedule:
    - cron: "0 7 * * 0"      # Sundays: the mutation run
  workflow_dispatch:

jobs:
  offline:
    # Pinned, not ubuntu-latest: a runner image changing under the job is a failure with no code change behind it.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - run: pip install -r requirements.txt
      - run: python -m pytest -q tests --ignore=tests/bot   # the live tests skip themselves without IPO_BOT_LIVE

  bot:
    # The keyless bot: lint, types, and every test offline with no keys and no network. Coverage under 100%
    # fails the job (--cov-fail-under=100), and so does a leakage test that finds the future in features.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m ruff check bot tests/bot
      - run: python -m black --check bot tests/bot
      - run: python -m mypy
      - run: python -m pytest -q tests/bot --cov=bot --cov-branch --cov-report=term-missing --cov-fail-under=100

  mutation:
    # mutmut needs fork(), so Linux only; weekly and on demand, since it reruns the unit tests for every mutant.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: mutmut run --max-children 4 || true
      - run: mutmut results || true
      - name: Mutation score (fails under 80% killed)
        run: |
          mutmut export-cicd-stats
          python - <<'EOF'
          import json, sys
          s = json.load(open("mutants/mutmut-cicd-stats.json"))
          judged = s["killed"] + s["survived"] + s["timeout"] + s["suspicious"]
          score = s["killed"] / max(judged, 1)
          print(f"mutation score {score:.1%}: {s['killed']} killed, {s['survived']} survived, {s['timeout']} timed out")
          sys.exit(0 if score >= 0.80 else 1)
          EOF
